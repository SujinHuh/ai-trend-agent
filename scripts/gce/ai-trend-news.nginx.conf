location = /ai-trend-agent/news {
    proxy_pass http://127.0.0.1:4174/news$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /ai-trend-agent/news/healthz {
    proxy_pass http://127.0.0.1:4174/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

